name: Build

on: [push, pull_request]

jobs:
  setup:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
    - name: get-version
      id: get_version
      run: echo "VERSION=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
  
  build-windows-library-x64:
    needs: [setup]
    runs-on: windows-latest
    env:
      PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-windows-x64
      SYMBOLS_PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-windows-x64-symbols
    steps:
    - uses: actions/checkout@v4
    - name: setup-vulkan-sdk
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        winget install -e --id KhronosGroup.VulkanSDK --accept-package-agreements --accept-source-agreements
        $sdk = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
        if ($null -eq $sdk) {
          throw "Vulkan SDK not found under C:\VulkanSDK after installation."
        }
        "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: build
      run: |
        mkdir build && cd build
        cmake .. -DENABLE_NCNN_BACKEND=ON -DENABLE_WEBRWKV_BACKEND=ON -DENABLE_LLAMACPP_BACKEND=ON -DENABLE_LLAMACPP_VULKAN=ON -DENABLE_MNN_BACKEND=ON -DENABLE_TTS=ON -DENABLE_VISION=ON -DBUILD_EXAMPLES=OFF -DENABLE_SERVER=OFF -DRWKV_MOBILE_ENABLE_DEBUG_SYMBOLS=ON
        cmake --build . --config RelWithDebInfo -j 8
    
    - name: package
      run: |
        cd build
        if (!(Test-Path RelWithDebInfo\rwkv_mobile.dll)) { throw "rwkv_mobile.dll was not produced" }
        if (!(Test-Path RelWithDebInfo\rwkv_mobile.pdb)) { throw "rwkv_mobile.pdb was not produced" }
        New-Item -ItemType Directory -Force package\Release | Out-Null
        Copy-Item RelWithDebInfo\rwkv_mobile.dll package\Release\rwkv_mobile.dll
        Push-Location package
        7z a ..\..\${{ env.PACKAGENAME }}.zip Release
        Pop-Location
    - name: package-symbols
      run: |
        cd build
        New-Item -ItemType Directory -Force symbols\windows-x64 | Out-Null
        Copy-Item RelWithDebInfo\rwkv_mobile.pdb symbols\windows-x64\rwkv_mobile.pdb
        Push-Location symbols
        7z a ..\..\${{ env.SYMBOLS_PACKAGENAME }}.zip windows-x64
        Pop-Location
    
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
    - name: upload-symbols-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SYMBOLS_PACKAGENAME }}
        path: ${{ env.SYMBOLS_PACKAGENAME }}.zip
  
  build-windows-library-arm64:
    needs: [setup]
    runs-on: windows-11-arm
    env:
      PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-windows-arm64
      SYMBOLS_PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-windows-arm64-symbols
    steps:
    - uses: actions/checkout@v4
    - name: build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
        cmake -S . -B build -G "Ninja Multi-Config" -D CMAKE_TOOLCHAIN_FILE=cmake\arm64-windows-llvm.cmake ^
          -DENABLE_NCNN_BACKEND=ON -DENABLE_WEBRWKV_BACKEND=OFF -DENABLE_LLAMACPP_BACKEND=ON -DENABLE_MNN_BACKEND=ON ^
          -DENABLE_TTS=ON -DENABLE_VISION=ON -DENABLE_QNN_BACKEND=ON -DBUILD_EXAMPLES=OFF -DENABLE_SERVER=OFF ^
          -DRWKV_MOBILE_ENABLE_DEBUG_SYMBOLS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake -LA -N build | findstr /C:"ENABLE_TTS:BOOL=ON" || exit /b 1
        cmake -LA -N build | findstr /C:"ENABLE_VISION:BOOL=ON" || exit /b 1
        cmake --build build --config RelWithDebInfo -j 8

    - name: package
      run: |
        cd build
        if (!(Test-Path RelWithDebInfo\rwkv_mobile.dll)) { throw "rwkv_mobile.dll was not produced" }
        if (!(Test-Path RelWithDebInfo\rwkv_mobile.pdb)) { throw "rwkv_mobile.pdb was not produced" }
        New-Item -ItemType Directory -Force package\Release | Out-Null
        Copy-Item RelWithDebInfo\rwkv_mobile.dll package\Release\rwkv_mobile-arm64.dll
        Push-Location package
        7z a ..\..\${{ env.PACKAGENAME }}.zip Release
        Pop-Location
    - name: package-symbols
      run: |
        cd build
        New-Item -ItemType Directory -Force symbols\windows-arm64 | Out-Null
        Copy-Item RelWithDebInfo\rwkv_mobile.pdb symbols\windows-arm64\rwkv_mobile-arm64.pdb
        Push-Location symbols
        7z a ..\..\${{ env.SYMBOLS_PACKAGENAME }}.zip windows-arm64
        Pop-Location
    
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
    - name: upload-symbols-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SYMBOLS_PACKAGENAME }}
        path: ${{ env.SYMBOLS_PACKAGENAME }}.zip

  build-ios-library:
    needs: [setup]
    runs-on: macos-15
    env:
      PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-ios-static
      SYMBOLS_PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-ios-static-symbols
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      IOS_DEPLOYMENT_TARGET: '13.0'
      ENABLE_BITCODE: OFF
      ENABLE_ARC: OFF
      ENABLE_VISIBILITY: OFF
    steps:
    - uses: actions/checkout@v4
    - name: build-arm64
      run: |
        rustup target add aarch64-apple-ios
        git clone --single-branch --branch rwkv-mobile https://github.com/mollysophia/mlx-swift-examples.git --depth 1
        cd mlx-swift-examples
        xcodebuild -project mlx-swift-examples.xcodeproj -scheme MLXModelFFI -configuration Release -derivedDataPath build -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
        cp build/Build/Products/Release-iphoneos/libMLXModelFFI.a ../src/backends/mlx/prebuilt/ios-arm64/libMLXModelFFI.a
        cp build/Build/Products/Release-iphoneos/mlx-swift_Cmlx.bundle/default.metallib ../src/backends/mlx/prebuilt/ios-arm64/default.metallib
        mlx_archive="$GITHUB_WORKSPACE/src/backends/mlx/prebuilt/ios-arm64/libMLXModelFFI.a"
        mlx_archive_tmp="$(mktemp -d)"
        (
          cd "$mlx_archive_tmp"
          ar -x "$mlx_archive"
          rm -f __.SYMDEF "__.SYMDEF SORTED"
          libtool -static -o "$mlx_archive.deduped" *.o
        )
        mv "$mlx_archive.deduped" "$mlx_archive"
        ranlib "$mlx_archive"
        rm -rf "$mlx_archive_tmp"
        cd ..
        rm -rf build-arm64
        mkdir build-arm64 && cd build-arm64
        export LIBRARY_PATH="$LIBRARY_PATH:${{ env.DEVELOPER_DIR }}/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk/usr/lib"
        cmake .. -DENABLE_NCNN_BACKEND=ON -DENABLE_WEBRWKV_BACKEND=ON -DENABLE_LLAMACPP_BACKEND=ON -DENABLE_COREML_BACKEND=ON \
          -DENABLE_MLX_BACKEND=ON -DBUILD_STATIC_LIB=ON -DBUILD_EXAMPLES=OFF \
          -DENABLE_TTS=ON -DENABLE_VISION=ON -DENABLE_WHISPER=ON -DENABLE_SERVER=OFF \
          -GXcode -DCMAKE_TOOLCHAIN_FILE=../cmake/ios.toolchain.cmake -DPLATFORM=OS64 -DARCHS="arm64" \
          -DDEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET -DENABLE_BITCODE=$ENABLE_BITCODE -DENABLE_ARC=$ENABLE_ARC -DENABLE_VISIBILITY=$ENABLE_VISIBILITY -DRWKV_MOBILE_ENABLE_DEBUG_SYMBOLS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build . --config Release -j 8 -- CODE_SIGNING_ALLOWED=NO
        mkdir -p ../release-build ../symbols/ios-static # ../debug-build
        cp librwkv_mobile.a ../release-build/librwkv_mobile.a
        cp _deps/ncnn-build/src/Release-iphoneos/libncnn.a ../release-build/libncnn.a
        cp ../src/backends/mlx/prebuilt/ios-arm64/libMLXModelFFI.a ../release-build/libMLXModelFFI.a
        cp ../src/backends/mlx/prebuilt/ios-arm64/default.metallib ../release-build/default.metallib
        cp librwkv_mobile.a ../symbols/ios-static/librwkv_mobile.a
        cp _deps/ncnn-build/src/Release-iphoneos/libncnn.a ../symbols/ios-static/libncnn.a
        cp ../src/backends/mlx/prebuilt/ios-arm64/libMLXModelFFI.a ../symbols/ios-static/libMLXModelFFI.a
        strip -S ../release-build/librwkv_mobile.a
        strip -S ../release-build/libncnn.a
        strip -S ../release-build/libMLXModelFFI.a
        cat > ../symbols/ios-static/README-ios-static-symbols.txt <<'EOF'
        iOS is packaged as static libraries. The .a files in this archive are built with DWARF debug info and should be linked into the final Flutter app before the app dSYM is generated. Upload the final app dSYM to Sentry; a standalone static-library dSYM will not match the app's loaded image UUID.
        EOF
        # rm librwkv_mobile.a
        # cmake --build . --config Debug -j 8 -- CODE_SIGNING_ALLOWED=NO
        # cp librwkv_mobile.a ../debug-build/librwkv_mobile.a
        # cp _deps/ncnn-build/src/Release-iphoneos/libncnn.a ../debug-build/libncnn.a
        # rm librwkv_mobile.a
        cd ..

    - name: package
      run: |
        pushd release-build
        zip -9 -y -r ../${{ env.PACKAGENAME }}.zip *.a default.metallib
        popd
    - name: package-symbols
      run: |
        pushd symbols
        zip -9 -y -r ../${{ env.SYMBOLS_PACKAGENAME }}.zip ios-static
        popd
        # pushd debug-build
        # zip -9 -y -r ../${{ env.PACKAGENAME }}-debug.zip *.a
        # popd
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
    - name: upload-symbols-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SYMBOLS_PACKAGENAME }}
        path: ${{ env.SYMBOLS_PACKAGENAME }}.zip
    # - name: upload-zip-debug
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: ${{ env.PACKAGENAME }}-debug
    #     path: ${{ env.PACKAGENAME }}-debug.zip

  build-macos-library-aarch64:
    needs: [setup]
    runs-on: macos-15
    env:
      PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-macos-aarch64
      SYMBOLS_PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-macos-aarch64-symbols
    steps:
    - uses: actions/checkout@v4
    - name: build-arm64
      run: |
        git clone --single-branch --branch rwkv-mobile https://github.com/mollysophia/mlx-swift-examples.git --depth 1
        cd mlx-swift-examples
        xcodebuild -project mlx-swift-examples.xcodeproj -scheme MLXModelFFI -configuration Release -derivedDataPath build -destination 'platform=OS X'
        cp build/Build/Products/Release/libMLXModelFFI.a ../src/backends/mlx/prebuilt/macos-arm64/libMLXModelFFI.a
        cd ..
        rm -rf build-arm64 # build-arm64-debug
        mkdir build-arm64 && cd build-arm64
        cmake .. -DENABLE_NCNN_BACKEND=ON -DENABLE_WEBRWKV_BACKEND=ON -DENABLE_MNN_BACKEND=ON -DENABLE_LLAMACPP_BACKEND=ON -DENABLE_MLX_BACKEND=ON \
          -DENABLE_TTS=ON -DENABLE_VISION=ON -DENABLE_WHISPER=ON -DENABLE_COREML_BACKEND=ON -DBUILD_EXAMPLES=OFF -DENABLE_SERVER=OFF -DCMAKE_BUILD_TYPE=Release \
          -DRWKV_MOBILE_ENABLE_DEBUG_SYMBOLS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build . -j 8
        mkdir -p ../symbols/macos-aarch64
        dsymutil librwkv_mobile.dylib -o ../symbols/macos-aarch64/librwkv_mobile.dylib.dSYM
        strip -Sx librwkv_mobile.dylib
        # cd ..
        # mkdir build-arm64-debug && cd build-arm64-debug
        # cmake .. -DENABLE_NCNN_BACKEND=ON -DENABLE_WEBRWKV_BACKEND=ON -DENABLE_MNN_BACKEND=ON -DENABLE_LLAMACPP_BACKEND=ON -DENABLE_MLX_BACKEND=ON \
        #   -DENABLE_TTS=ON -DENABLE_VISION=ON -DENABLE_WHISPER=ON -DENABLE_COREML_BACKEND=ON -DBUILD_EXAMPLES=OFF -DENABLE_SERVER=OFF -DCMAKE_BUILD_TYPE=Debug \
        #   -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        # cmake --build . -j 8
    - name: package
      run: |
        rm -rf package
        mkdir -p package
        cp build-arm64/librwkv_mobile.dylib package/librwkv_mobile.dylib
        pushd package
        zip -9 -y -r ../${{ env.PACKAGENAME }}.zip .
        popd
    - name: package-symbols
      run: |
        pushd symbols
        zip -9 -y -r ../${{ env.SYMBOLS_PACKAGENAME }}.zip macos-aarch64
        popd
        # pushd build-arm64-debug
        # zip -9 -y -r ../${{ env.PACKAGENAME }}-debug.zip librwkv_mobile.dylib
        # popd
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
    - name: upload-symbols-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SYMBOLS_PACKAGENAME }}
        path: ${{ env.SYMBOLS_PACKAGENAME }}.zip
    # - name: upload-zip-debug
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: ${{ env.PACKAGENAME }}-debug
    #     path: ${{ env.PACKAGENAME }}-debug.zip

  build-android-library:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-aarch64-android-ndk-r25c
      SYMBOLS_PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-aarch64-android-ndk-r25c-symbols
    steps:
    - uses: actions/checkout@v4
    - name: Install Ninja
      run: |
        sudo apt-get install ninja-build
    - name: ndk-r25c
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O $GITHUB_WORKSPACE/android-ndk-r25c-linux.zip
        cd $GITHUB_WORKSPACE && unzip -q android-ndk-r25c-linux.zip
    - name: build
      run: |
        rustup target add --toolchain stable-x86_64-unknown-linux-gnu aarch64-linux-android
        rustup target add --toolchain 1.89.0-x86_64-unknown-linux-gnu aarch64-linux-android
        rm -rf build
        mkdir build && cd build
        cmake .. -DENABLE_NCNN_BACKEND=ON -DENABLE_WEBRWKV_BACKEND=ON -DENABLE_QNN_BACKEND=ON -DENABLE_MTK_NP7_BACKEND=ON \
          -DENABLE_TTS=ON -DENABLE_VISION=ON -DENABLE_WHISPER=ON -DBUILD_EXAMPLES=OFF -DENABLE_SERVER=OFF \
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_NDK=$GITHUB_WORKSPACE/android-ndk-r25c \
          -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/android-ndk-r25c/build/cmake/android.toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DRWKV_MOBILE_ENABLE_DEBUG_SYMBOLS=ON \
          -G Ninja
        ninja
        mkdir -p "$GITHUB_WORKSPACE/symbols/android-arm64-v8a"
        LLVM_TOOLCHAIN="$GITHUB_WORKSPACE/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin"
        "$LLVM_TOOLCHAIN/llvm-objcopy" --only-keep-debug --compress-debug-sections=zlib librwkv_mobile.so "$GITHUB_WORKSPACE/symbols/android-arm64-v8a/librwkv_mobile.so.debug"
        "$LLVM_TOOLCHAIN/llvm-strip" --strip-debug --strip-unneeded librwkv_mobile.so
        "$LLVM_TOOLCHAIN/llvm-objcopy" --add-gnu-debuglink="$GITHUB_WORKSPACE/symbols/android-arm64-v8a/librwkv_mobile.so.debug" librwkv_mobile.so
        cd ..
        # mkdir build-debug && cd build-debug
        # cmake .. -DENABLE_NCNN_BACKEND=ON -DENABLE_WEBRWKV_BACKEND=ON -DENABLE_QNN_BACKEND=ON -DENABLE_MTK_NP7_BACKEND=ON \
        #   -DENABLE_TTS=ON -DENABLE_VISION=ON -DENABLE_WHISPER=ON -DBUILD_EXAMPLES=OFF -DENABLE_SERVER=OFF \
        #   -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_NDK=$GITHUB_WORKSPACE/android-ndk-r25c \
        #   -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/android-ndk-r25c/build/cmake/android.toolchain.cmake -DCMAKE_BUILD_TYPE=Debug \
        #   -G Ninja
        # ninja
    - name: package
      run: |
        rm -rf package
        mkdir -p package
        cp build/librwkv_mobile.so package/librwkv_mobile.so
        pushd package
        zip -9 -y -r ../${{ env.PACKAGENAME }}.zip .
        popd
    - name: package-symbols
      run: |
        pushd symbols
        zip -9 -y -r ../${{ env.SYMBOLS_PACKAGENAME }}.zip android-arm64-v8a
        popd
        # pushd build-debug
        # zip -9 -y -r ../${{ env.PACKAGENAME }}-debug.zip librwkv_mobile.so
        # popd
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
    - name: upload-symbols-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SYMBOLS_PACKAGENAME }}
        path: ${{ env.SYMBOLS_PACKAGENAME }}.zip
    # - name: upload-zip-debug
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: ${{ env.PACKAGENAME }}-debug
    #     path: ${{ env.PACKAGENAME }}-debug.zip

  build-linux-x64-library:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-linux-x86_64
      SYMBOLS_PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-linux-x86_64-symbols
    steps:
    - uses: actions/checkout@v4
    - name: setup-vulkan-sdk
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev glslang-tools spirv-headers
        if ! command -v glslc >/dev/null 2>&1; then
          sudo apt-get install -y glslc
        fi
        if ! command -v glslc >/dev/null 2>&1; then
          sudo apt-get install -y shaderc
        fi
        command -v glslc >/dev/null 2>&1 || { echo "glslc is required but not found"; exit 1; }
    - name: build
      run: |
        rm -rf build
        mkdir build && cd build
        cmake .. -DENABLE_NCNN_BACKEND=ON -DENABLE_WEBRWKV_BACKEND=ON -DENABLE_LLAMACPP_BACKEND=ON -DENABLE_LLAMACPP_VULKAN=ON -DENABLE_VISION=ON -DENABLE_WHISPER=ON -DENABLE_TTS=ON -DBUILD_EXAMPLES=OFF -DENABLE_SERVER=OFF -DCMAKE_BUILD_TYPE=Release -DRWKV_MOBILE_ENABLE_DEBUG_SYMBOLS=ON
        cmake --build . -j 8
        mv librwkv_mobile.so librwkv_mobile-linux-x86_64.so
        objcopy --only-keep-debug --compress-debug-sections=zlib librwkv_mobile-linux-x86_64.so librwkv_mobile-linux-x86_64.so.debug
        strip --strip-debug --strip-unneeded librwkv_mobile-linux-x86_64.so
        objcopy --add-gnu-debuglink=librwkv_mobile-linux-x86_64.so.debug librwkv_mobile-linux-x86_64.so
        mkdir -p ../symbols/linux-x86_64
        mv librwkv_mobile-linux-x86_64.so.debug ../symbols/linux-x86_64/librwkv_mobile-linux-x86_64.so.debug
    - name: package
      run: |
        rm -rf package
        mkdir -p package
        cp build/librwkv_mobile-linux-x86_64.so package/librwkv_mobile-linux-x86_64.so
        pushd package
        zip -9 -y -r ../${{ env.PACKAGENAME }}.zip .
        popd
    - name: package-symbols
      run: |
        pushd symbols
        zip -9 -y -r ../${{ env.SYMBOLS_PACKAGENAME }}.zip linux-x86_64
        popd
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
    - name: upload-symbols-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SYMBOLS_PACKAGENAME }}
        path: ${{ env.SYMBOLS_PACKAGENAME }}.zip

  build-linux-arm64-library:
    needs: [setup]
    runs-on: ubuntu-22.04-arm
    env:
      PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-linux-aarch64
      SYMBOLS_PACKAGENAME: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-linux-aarch64-symbols
    steps:
    - uses: actions/checkout@v4
    - name: build
      run: |
        rm -rf build
        mkdir build && cd build
        cmake .. -DENABLE_NCNN_BACKEND=ON -DENABLE_WEBRWKV_BACKEND=ON -DENABLE_LLAMACPP_BACKEND=ON -DENABLE_QNN_BACKEND=ON -DBUILD_EXAMPLES=OFF -DENABLE_SERVER=OFF -DCMAKE_BUILD_TYPE=Release -DRWKV_MOBILE_ENABLE_DEBUG_SYMBOLS=ON
        cmake --build . -j 8
        mv librwkv_mobile.so librwkv_mobile-linux-aarch64.so
        objcopy --only-keep-debug --compress-debug-sections=zlib librwkv_mobile-linux-aarch64.so librwkv_mobile-linux-aarch64.so.debug
        strip --strip-debug --strip-unneeded librwkv_mobile-linux-aarch64.so
        objcopy --add-gnu-debuglink=librwkv_mobile-linux-aarch64.so.debug librwkv_mobile-linux-aarch64.so
        mkdir -p ../symbols/linux-aarch64
        mv librwkv_mobile-linux-aarch64.so.debug ../symbols/linux-aarch64/librwkv_mobile-linux-aarch64.so.debug
    - name: package
      run: |
        rm -rf package
        mkdir -p package
        cp build/librwkv_mobile-linux-aarch64.so package/librwkv_mobile-linux-aarch64.so
        pushd package
        zip -9 -y -r ../${{ env.PACKAGENAME }}.zip .
        popd
    - name: package-symbols
      run: |
        pushd symbols
        zip -9 -y -r ../${{ env.SYMBOLS_PACKAGENAME }}.zip linux-aarch64
        popd
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
    - name: upload-symbols-zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SYMBOLS_PACKAGENAME }}
        path: ${{ env.SYMBOLS_PACKAGENAME }}.zip

  upload-dev-release:
    needs:
      - setup
      - build-ios-library
      - build-android-library
      - build-macos-library-aarch64
      - build-windows-library-x64
      - build-windows-library-arm64
      - build-linux-x64-library
      - build-linux-arm64-library
    runs-on: ubuntu-latest
    steps:
      - name: download-ios
        uses: actions/download-artifact@v4
        with:
          name: librwkv_mobile-${{ needs.setup.outputs.VERSION }}-ios-static
